<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Realtime Web</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-app: #0e1621;
      --bg-sidebar: #17212b;
      --bg-input: #0e1621;
      --bg-msg-in: #182533;
      --bg-msg-out: #2b5278;
      --text-main: #ffffff;
      --text-sub: #7f91a4;
      --accent: #5288c1;
      --border-color: #0e1621;
      --chat-pattern: radial-gradient(#1e2c3a 1px, transparent 0);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-app); color: var(--text-main); }

    .telegram-app { display: flex; width: 100vw; height: 100dvh; background: var(--bg-sidebar); position: relative; }
    .sidebar { width: 350px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; height: 100%; }
    .sidebar-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 56px; }
    
    .my-profile-btn { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
    .chats-list { flex: 1; overflow-y: auto; }
    .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
    .chat-item:hover, .chat-item.active { background: rgba(82, 136, 193, 0.15); }
    
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: #fff; text-transform: uppercase; flex-shrink: 0; }
    .avatar.small { width: 36px; height: 36px; font-size: 14px; }
    
    .chat-info { flex: 1; overflow: hidden; }
    .chat-info .name { font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .chat-info .type-tag { font-size: 10px; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 4px; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-app); position: relative; height: 100%; }
    .chat-header { padding: 10px 16px; background: var(--bg-sidebar); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); height: 56px; }
    .chat-header-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }

    .messages-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background-image: var(--chat-pattern); background-size: 16px 16px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px 12px 12px 0px; background: var(--bg-msg-in); color: var(--text-main); align-self: flex-start; word-break: break-word; font-size: 14.5px; }
    .msg.me { align-self: flex-end; background: var(--bg-msg-out); border-radius: 12px 12px 0px 12px; }
    .msg-author { font-size: 12px; font-weight: bold; color: var(--accent); margin-bottom: 3px; }
    .msg.me .msg-author { display: none; }
    .msg-meta { font-size: 10px; color: var(--text-sub); float: right; margin-top: 4px; margin-left: 10px; }

    .input-bar { padding: 10px 14px; background: var(--bg-sidebar); display: flex; align-items: center; gap: 8px; }
    .input-wrapper { flex: 1; display: flex; align-items: center; background: var(--bg-input); border-radius: 22px; padding: 2px 14px; }
    .input-wrapper input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-main); padding: 10px 0; font-size: 15px; }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 16px; }
    .modal-box { background: var(--bg-sidebar); padding: 24px; border-radius: 16px; width: 100%; max-width: 380px; border: 1px solid var(--border-color); }
    .modal-box h3 { margin-bottom: 16px; text-align: center; }
    .modal-box input, .modal-box select { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); font-size: 14px; margin-bottom: 12px; outline: none; }
    .modal-box button { width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }

    .members-list { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 12px; }
    .member-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; gap: 8px; }
    .member-info { display: flex; align-items: center; gap: 8px; flex: 1; }
    
    .btn-admin-action { padding: 3px 8px; font-size: 11px; border: none; border-radius: 12px; cursor: pointer; font-weight: 500; }
    .btn-admin-add { background: var(--accent); color: #fff; }
    .btn-admin-remove { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: 1px solid rgba(255, 82, 82, 0.3); }

    #login-overlay { position: fixed; inset: 0; background: var(--bg-app); display: flex; align-items: center; justify-content: center; z-index: 4000; padding: 16px; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; position: absolute; inset: 0; z-index: 10; }
      .chat-area { width: 100%; position: absolute; inset: 0; z-index: 5; }
      .telegram-app.chat-active .sidebar { transform: translateX(-100%); }
      .telegram-app.chat-active .chat-area { z-index: 15; }
    }
  </style>
</head>
<body>

  <!-- Kirish -->
  <div id="login-overlay">
    <div class="modal-box">
      <h3>Telegram Realtime</h3>
      <input id="userName" type="text" placeholder="Ismingiz..." maxlength="20" autofocus>
      <input id="userTag" type="text" placeholder="Username (@bekzod)..." maxlength="20">
      <button onclick="startChat()">Kirish</button>
    </div>
  </div>

  <!-- Chat Profili va Admin Boshqaruvi Modali -->
  <div class="modal" id="chatProfileModal">
    <div class="modal-box">
      <h3 id="chatProfileType">Chat Profili</h3>
      <div style="text-align: center; margin-bottom: 16px;">
        <h4 id="chatProfileTitle" style="font-size: 18px;">...</h4>
      </div>
      <div class="members-list">
        <h4 style="font-size: 13px; margin-bottom: 8px; color: var(--text-sub);">A'zolar ro'yxati</h4>
        <div id="membersContainer"></div>
      </div>
      <button onclick="closeModal('chatProfileModal')" style="margin-top: 16px; background: transparent; border: 1px solid var(--border-color);">Yopish</button>
    </div>
  </div>

  <div class="telegram-app" id="telegramApp">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="my-profile-btn">
          <div class="avatar small" id="myHeaderAvatar">U</div>
          <span id="myHeaderName" style="font-weight: 600;">...</span>
        </div>
      </div>
      <div class="chats-list" id="chatsContainer"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div class="chat-header-info" onclick="openChatProfile()">
          <div class="avatar" id="activeAvatar">S</div>
          <div>
            <div class="title" id="activeTitle">Sinf Guruhi</div>
            <div class="sub" id="activeSub">a'zolarni ko'rish uchun bosing</div>
          </div>
        </div>
      </div>

      <div class="messages-container" id="messagesBox"></div>

      <div class="input-bar" id="inputControls">
        <div class="input-wrapper">
          <input type="text" id="messageInput" placeholder="Xabar yozing..." autocomplete="off">
        </div>
        <button class="send-btn" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myName = '';
    let myTag = '';
    let currentChatId = 'main';
    let chats = [];
    let messages = {};

    socket.on('initData', (data) => {
      chats = data.chats;
      messages = data.messages;
      renderChats();
      renderMessages();
    });

    socket.on('updateChats', (updatedChats) => {
      chats = updatedChats;
      renderChats();
      if (document.getElementById('chatProfileModal').style.display === 'flex') {
        renderMembersList();
      }
    });

    socket.on('newMessage', ({ chatId, messageData }) => {
      if (!messages[chatId]) messages[chatId] = [];
      messages[chatId].push(messageData);
      if (chatId === currentChatId) {
        renderMessages();
      }
    });

    function startChat() {
      const name = document.getElementById('userName').value.trim();
      let tag = document.getElementById('userTag').value.trim();
      
      if (!name || !tag) {
        alert("Ism va Username kiriting!");
        return;
      }

      myName = name;
      myTag = tag.startsWith('@') ? tag : '@' + tag;

      document.getElementById('myHeaderAvatar').textContent = myName[0].toUpperCase();
      document.getElementById('myHeaderName').textContent = myName;
      document.getElementById('login-overlay').style.display = 'none';

      socket.emit('joinUser', { name: myName, tag: myTag });
      selectChat('main');
    }

    function renderChats() {
      const container = document.getElementById('chatsContainer');
      container.innerHTML = '';

      chats.forEach(c => {
        container.innerHTML += `
          <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="selectChat('${c.id}')">
            <div class="avatar">${c.initial}</div>
            <div class="chat-info">
              <div class="name">${c.name} <span class="type-tag">${c.type === 'channel' ? 'Kanal' : 'Guruh'}</span></div>
            </div>
          </div>`;
      });
    }

    function selectChat(id) {
      currentChatId = id;
      renderChats();
      const chat = chats.find(c => c.id === id);
      document.getElementById('activeTitle').textContent = chat.name;
      document.getElementById('activeAvatar').textContent = chat.initial;
      
      const canWrite = chat.type !== 'channel' || chat.owner === myName || chat.admins.includes(myName);
      document.getElementById('inputControls').style.display = canWrite ? 'flex' : 'none';

      renderMessages();
    }

    function renderMessages() {
      const box = document.getElementById('messagesBox');
      box.innerHTML = '';
      const currentMsgs = messages[currentChatId] || [];

      currentMsgs.forEach(d => {
        const isMe = d.senderName === myName;
        const dt = new Date(d.time);
        const timeStr = ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);

        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : ''}`;
        div.innerHTML = `
          <div class="msg-author">${d.senderName}</div>
          <div>${d.text}</div>
          <div class="msg-meta">${timeStr}</div>
        `;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function handleSend() {
      const inp = document.getElementById('messageInput');
      const text = inp.value.trim();
      if (!text) return;

      const messageData = {
        id: 'msg_' + Date.now(),
        senderName: myName,
        text: text,
        time: new Date()
      };

      socket.emit('sendMessage', { chatId: currentChatId, messageData });
      inp.value = '';
    }

    function openChatProfile() {
      const chat = chats.find(c => c.id === currentChatId);
      if (!chat) return;
      document.getElementById('chatProfileTitle').textContent = chat.name;
      renderMembersList();
      document.getElementById('chatProfileModal').style.display = 'flex';
    }

    function renderMembersList() {
      const chat = chats.find(c => c.id === currentChatId);
      const container = document.getElementById('membersContainer');
      container.innerHTML = '';

      const isAdminOrOwner = chat.owner === myName || chat.admins.includes(myName);

      chat.members.forEach(member => {
        const isOwner = member === chat.owner;
        const isAdmin = chat.admins.includes(member);
        let adminActionBtn = '';

        if (isAdminOrOwner && !isOwner) {
          if (isAdmin) {
            adminActionBtn = `<button class="btn-admin-action btn-admin-remove" onclick="toggleAdmin('${member}', 'remove')">Admindan olish</button>`;
          } else {
            adminActionBtn = `<button class="btn-admin-action btn-admin-add" onclick="toggleAdmin('${member}', 'add')">Admin qilish</button>`;
          }
        }

        container.innerHTML += `
          <div class="member-item">
            <div class="member-info">
              <div class="avatar small">${member[0].toUpperCase()}</div>
              <div style="font-size:13px;">${member} ${isAdmin ? '<b style="color:var(--accent);">(Admin)</b>' : ''}</div>
            </div>
            ${adminActionBtn}
          </div>
        `;
      });
    }

    function toggleAdmin(member, action) {
      socket.emit('toggleAdmin', { chatId: currentChatId, targetMember: member, action });
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    document.getElementById('messageInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
    document.getElementById('userName').addEventListener('keydown', (e) => { if (e.key === 'Enter') startChat(); });
  </script>
</body>
</html>
